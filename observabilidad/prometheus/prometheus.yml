# Prometheus del D-RTS (ADR-0015, ADR-0020).
global:
  # 1s y no los 15s por defecto: una corrida del loadgen dura ~30s; con 15s
  # serían dos puntos y no se vería nada en vivo. Costo: más muestras
  # guardadas (irrelevante en local).
  scrape_interval: 1s
  evaluation_interval: 1s

# Cada servicio se scrapea en sus dos formas de correr, con la etiqueta
# "entorno": nativo (binarios en el host, vía host.docker.internal) y compose
# (contenedores, por nombre de servicio). Normalmente corre una sola: la otra
# figura "down", y es normal. Lo mismo el loadgen fuera de una corrida.
scrape_configs:
  - job_name: fraud_engine
    static_configs:
      - targets: ["host.docker.internal:2112"]
        labels: { entorno: nativo }
      - targets: ["fraud-engine:2112"]
        labels: { entorno: compose }
  - job_name: settlement
    static_configs:
      - targets: ["host.docker.internal:2113"]
        labels: { entorno: nativo }
      - targets: ["settlement:2113"]
        labels: { entorno: compose }
  # Consumidores del cold path: solo en Compose (un contenedor por rol).
  - job_name: eventos
    static_configs:
      - targets: ["eventos-auditoria:2115", "eventos-alertas:2115", "eventos-estadisticas:2115"]
        labels: { entorno: compose }
  - job_name: loadgen
    static_configs:
      - targets: ["host.docker.internal:2114"]
        labels: { entorno: nativo }
      - targets: ["loadgen:2114"]
        labels: { entorno: compose }
